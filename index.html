<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Routines</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5B4BDA">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Routines">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4F2FB;
    --paper-deep: #E9E4F8;
    --ink: #241F3A;
    --ink-soft: #6E6690;
    --violet: #6C5CE7;
    --violet-deep: #5340D9;
    --teal: #2EC4B6;
    --teal-deep: #1FA79A;
    --warm: #FF9F45;
    --line: #E1DCF3;
    --card: #FFFFFF;
    --danger: #E0517A;
    --shadow: 0 1px 0 rgba(36,31,58,0.04), 0 6px 18px rgba(36,31,58,0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; }

  button { font-family: inherit; }

  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  .app-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px 10px;
  }
  .app-header h1 { font-size: 22px; font-weight: 700; color: var(--violet-deep); }
  .icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    color: var(--ink);
  }
  .icon-btn:hover { border-color: var(--violet); }

  /* Main content */
  .view { flex: 1; padding: 4px 18px 100px; max-width: 640px; width: 100%; margin: 0 auto; }
  .hidden { display: none !important; }

  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-soft); margin: 18px 0 10px;
  }

  .empty-state {
    text-align: center; padding: 48px 20px; color: var(--ink-soft);
  }
  .empty-state .big { font-size: 40px; margin-bottom: 10px; }
  .empty-state p { margin: 6px 0 18px; font-size: 14px; }

  /* Cards */
  .card-list { display: flex; flex-direction: column; gap: 10px; }
  .routine-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 14px;
    box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 12px;
  }
  .routine-card .emoji { font-size: 28px; width: 42px; text-align: center; flex-shrink: 0; }
  .routine-card .info { flex: 1; min-width: 0; }
  .routine-card .info h3 { font-size: 16px; font-weight: 600; color: var(--ink); }
  .routine-card .info .meta { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .routine-card .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .routine-card.due { border-color: var(--warm); }
  .due-badge {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
    color: #fff; background: var(--warm); border-radius: 999px; padding: 2px 7px; margin-left: 6px; vertical-align: middle;
  }
  .routine-card .play-btn {
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--violet); color: #fff; border: none; cursor: pointer; font-size: 16px;
  }
  .routine-card .play-btn:hover { background: var(--violet-deep); }
  .ghost-btn {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 10px;
    background: none; border: 1px solid var(--line); cursor: pointer; font-size: 14px; color: var(--ink-soft);
  }
  .ghost-btn:hover { border-color: var(--violet); color: var(--violet); }

  .action-row {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: var(--shadow);
  }
  .action-row .emoji { font-size: 22px; width: 32px; text-align: center; flex-shrink: 0; }
  .action-row .info { flex: 1; min-width: 0; }
  .action-row .info h4 { margin: 0; font-size: 14.5px; font-weight: 600; }
  .action-row .info .meta { font-size: 12px; color: var(--ink-soft); margin-top: 2px; font-family: 'IBM Plex Mono', monospace; }
  .action-row .actions { display: flex; gap: 6px; }

  /* FAB */
  .fab {
    position: fixed; right: 20px; bottom: 24px;
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--violet); color: #fff; border: none;
    font-size: 26px; line-height: 1; cursor: pointer;
    box-shadow: 0 6px 20px rgba(91,75,218,0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 20;
  }
  .fab:hover { background: var(--violet-deep); }

  /* Bottom nav */
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; background: var(--card);
    border-top: 1px solid var(--line);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    z-index: 15;
  }
  .bottom-nav button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    border: none; background: none; padding: 8px 4px; cursor: pointer;
    color: var(--ink-soft); font-size: 11px; font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.03em; text-transform: uppercase; border-radius: 10px;
  }
  .bottom-nav button .nav-icon { font-size: 19px; }
  .bottom-nav button.active { color: var(--violet-deep); }
  .bottom-nav button.active .nav-icon { transform: scale(1.08); }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(36,31,58,0.45);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 50;
  }
  @media (min-width: 640px) {
    .modal-backdrop { align-items: center; }
  }
  .modal {
    background: var(--paper); width: 100%; max-width: 480px;
    border-radius: 20px 20px 0 0;
    max-height: 88vh; overflow-y: auto;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
  }
  @media (min-width: 640px) {
    .modal { border-radius: 20px; max-height: 80vh; }
  }
  .modal h2 { font-size: 19px; margin-bottom: 16px; }
  .modal-close-row { display: flex; justify-content: flex-end; margin-bottom: -6px; }

  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px;
  }
  .field input[type=text], .field input[type=number], .field input[type=time], .field select {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 15px; font-family: inherit; background: var(--card); color: var(--ink);
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--violet); }
  .duration-row { display: flex; gap: 10px; }
  .duration-row .field { flex: 1; }

  .day-toggle { display: flex; gap: 6px; }
  .day-toggle button {
    flex: 1; padding: 8px 0; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); font-size: 12px; font-weight: 600; color: var(--ink-soft); cursor: pointer;
  }
  .day-toggle button.selected { border-color: var(--violet); color: var(--violet-deep); background: var(--paper-deep); }

  .emoji-picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .emoji-picker button {
    width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); font-size: 17px; cursor: pointer;
  }
  .emoji-picker button.selected { border-color: var(--violet); background: var(--paper-deep); }

  .name-icon-row { display: flex; gap: 8px; align-items: flex-start; }
  .name-icon-row input { flex: 1; }
  .icon-select { position: relative; flex-shrink: 0; }
  .icon-select-btn {
    width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); font-size: 20px; cursor: pointer; line-height: 1;
    text-align: center; font-family: inherit; padding: 0; color: var(--ink);
  }
  .icon-select-btn:hover { border-color: var(--violet); }
  .icon-select-btn:focus { outline: none; border-color: var(--violet); }
  .icon-select-panel {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 20;
    width: 244px; max-width: 70vw; max-height: 260px; overflow-y: auto;
    padding: 8px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  }
  .icon-select-panel.hidden { display: none; }

  .type-toggle { display: flex; gap: 8px; }
  .type-toggle button {
    flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); cursor: pointer; font-size: 13px; color: var(--ink-soft); font-weight: 600;
  }
  .type-toggle button.selected { border-color: var(--violet); color: var(--violet-deep); background: var(--paper-deep); }

  .btn-primary {
    width: 100%; padding: 13px; border: none; border-radius: 12px;
    background: var(--violet); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    margin-top: 6px;
  }
  .btn-primary:hover { background: var(--violet-deep); }
  .btn-secondary {
    width: 100%; padding: 13px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer;
    margin-top: 8px;
  }
  .btn-danger { color: var(--danger); border-color: var(--danger); }

  /* Routine step picker */
  .step-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .step-item {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
  }
  .step-item .num {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); width: 18px;
  }
  .step-item .emoji { font-size: 18px; }
  .step-item .name { flex: 1; font-size: 14px; font-weight: 500; }
  .step-item .meta { font-size: 11px; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; }
  .step-item .step-actions { display: flex; gap: 3px; }
  .step-item .step-actions button {
    width: 26px; height: 26px; border: none; background: none; color: var(--ink-soft); cursor: pointer; font-size: 13px;
  }
  .step-item .step-actions button:hover { color: var(--violet); }

  .picker-list { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; margin-bottom: 10px; }
  .picker-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; width: 100%;
    border: 1px solid var(--line); border-radius: 10px; background: var(--card); cursor: pointer;
    font-family: inherit; text-align: left; color: inherit;
  }
  .picker-row:hover { border-color: var(--violet); }
  .picker-row .emoji { font-size: 17px; }
  .picker-row .name { flex: 1; font-size: 13.5px; }
  .picker-row .meta { font-size: 11px; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; }

  /* Run view */
  .run-overlay {
    position: fixed; inset: 0; background: var(--violet-deep);
    z-index: 100; display: flex; flex-direction: column; color: #fff;
  }
  .run-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(16px + env(safe-area-inset-top)) 18px 8px;
  }
  .run-top button {
    background: rgba(255,255,255,0.15); border: none; color: #fff;
    width: 36px; height: 36px; border-radius: 10px; font-size: 15px; cursor: pointer;
  }
  .run-progress-dots { display: flex; gap: 5px; justify-content: center; padding: 4px 18px 0; flex-wrap: wrap; }
  .run-progress-dots span {
    width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.3);
  }
  .run-progress-dots span.done { background: var(--teal); }
  .run-progress-dots span.current { background: #fff; width: 9px; height: 9px; }

  .run-body {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px 24px; text-align: center;
  }
  .run-emoji { font-size: 64px; margin-bottom: 14px; }
  .run-name { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; margin-bottom: 22px; max-width: 340px; }
  .run-timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 56px; font-weight: 600;
    margin-bottom: 18px; font-variant-numeric: tabular-nums;
  }
  .run-timer-ring { position: relative; width: 200px; height: 200px; margin-bottom: 8px; }
  .run-timer-ring svg { transform: rotate(-90deg); }
  .run-timer-ring .ring-bg { fill: none; stroke: rgba(255,255,255,0.18); stroke-width: 8; }
  .run-timer-ring .ring-fg { fill: none; stroke: var(--teal); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.25s linear; }
  .run-timer-ring .ring-label {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace; font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .run-timer-controls { display: flex; gap: 12px; margin-top: 6px; }
  .run-timer-controls button {
    padding: 10px 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.1); color: #fff; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  .run-timer-controls button.primary { background: var(--teal); border-color: var(--teal); color: #17332f; }

  .run-bottom { padding: 16px 24px calc(24px + env(safe-area-inset-bottom)); display: flex; gap: 10px; }
  .run-bottom button {
    flex: 1; padding: 15px; border-radius: 14px; border: none; cursor: pointer; font-size: 15px; font-weight: 600;
  }
  .run-bottom .btn-back { background: rgba(255,255,255,0.14); color: #fff; flex: 0 0 52px; }
  .run-bottom .btn-next { background: #fff; color: var(--violet-deep); flex: 1; }

  .run-complete { display: flex; flex-direction: column; align-items: center; }
  .run-complete .big { font-size: 60px; margin-bottom: 10px; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>
<div id="app">
  <header class="app-header">
    <h1>Routines</h1>
    <button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button>
  </header>

  <main>
    <section id="view-home" class="view">
      <div id="homeContent"></div>
    </section>

    <section id="view-actions" class="view hidden">
      <div class="section-label">Your custom actions</div>
      <div id="actionsContent"></div>
    </section>
  </main>

  <button class="fab" id="fabBtn" title="Add">+</button>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="home"><span class="nav-icon">🏠</span>Home</button>
    <button class="nav-btn" data-view="actions"><span class="nav-icon">🧩</span>Actions</button>
  </nav>
</div>

<!-- Routine editor modal -->
<div class="modal-backdrop hidden" id="routineModal">
  <div class="modal">
    <div class="modal-close-row"><button class="icon-btn" data-close="routineModal">✕</button></div>
    <h2 id="routineModalTitle">New routine</h2>
    <div class="field">
      <label>Name</label>
      <div class="name-icon-row">
        <input type="text" id="routineName" placeholder="e.g. Morning skincare">
        <div class="icon-select">
          <input type="text" class="icon-select-btn" id="routineIconBtn" maxlength="8" autocomplete="off" spellcheck="false" title="Click for quick picks, or press Win + . to choose from all emoji">
          <div class="emoji-picker icon-select-panel hidden" id="routineEmojiPicker"></div>
        </div>
      </div>
    </div>
    <div class="section-label" style="margin-top:20px;">Trigger</div>
    <div class="field">
      <label style="text-transform:none;font-size:11px;">Type</label>
      <select id="triggerType">
        <option value="off">None</option>
        <option value="weekly">Day of week</option>
        <option value="monthly">Day of month</option>
        <option value="interval">Regular interval</option>
        <option value="sun">Sunrise / sunset</option>
        <option value="weather">Weather hits x°</option>
      </select>
    </div>

    <div class="field hidden" id="triggerWeeklyFields">
      <div class="field">
        <label style="text-transform:none;font-size:11px;">Time</label>
        <input type="time" id="scheduleTime" value="07:00">
      </div>
      <div class="field">
        <label style="text-transform:none;font-size:11px;">Days</label>
        <div class="day-toggle" id="scheduleDays"></div>
      </div>
    </div>

    <div class="field hidden" id="triggerMonthlyFields">
      <div class="field">
        <label style="text-transform:none;font-size:11px;">Time</label>
        <input type="time" id="monthlyTime" value="07:00">
      </div>
      <div class="field">
        <label style="text-transform:none;font-size:11px;">Day of month (1&ndash;31)</label>
        <input type="number" id="monthlyDay" min="1" max="31" value="1">
      </div>
    </div>

    <div class="field hidden" id="triggerIntervalFields">
      <div class="duration-row">
        <div class="field">
          <label style="text-transform:none;font-size:11px;">Every</label>
          <input type="number" id="intervalValue" min="1" value="1">
        </div>
        <div class="field">
          <label style="text-transform:none;font-size:11px;">Unit</label>
          <select id="intervalUnit">
            <option value="hours">Hours</option>
            <option value="days">Days</option>
          </select>
        </div>
      </div>
      <p style="font-size:12px;color:var(--ink-soft);margin:0;">Counts from when the routine was last completed.</p>
    </div>

    <div class="field hidden" id="triggerSunFields">
      <div class="field">
        <label style="text-transform:none;font-size:11px;">Event</label>
        <div class="type-toggle" id="sunEventToggle">
          <button type="button" data-sun="sunrise">Sunrise</button>
          <button type="button" data-sun="sunset">Sunset</button>
        </div>
      </div>
      <div class="field">
        <label style="text-transform:none;font-size:11px;">Offset (minutes, +/-)</label>
        <input type="number" id="sunOffset" value="0">
      </div>
      <p style="font-size:12px;color:var(--ink-soft);margin:0 0 6px;" id="sunLocationStatus"></p>
      <button type="button" class="btn-secondary" id="sunLocationBtn" style="margin-top:0;">Use my location</button>
    </div>

    <div class="field hidden" id="triggerWeatherFields">
      <div class="field">
        <label style="text-transform:none;font-size:11px;">When temperature is</label>
        <div class="type-toggle" id="weatherCmpToggle">
          <button type="button" data-weathercmp="above">Above</button>
          <button type="button" data-weathercmp="below">Below</button>
        </div>
      </div>
      <div class="duration-row">
        <div class="field">
          <label style="text-transform:none;font-size:11px;">Target temp</label>
          <input type="number" id="weatherTemp" value="20">
        </div>
        <div class="field">
          <label style="text-transform:none;font-size:11px;">Unit</label>
          <select id="weatherUnit">
            <option value="C">°C</option>
            <option value="F">°F</option>
          </select>
        </div>
      </div>
      <p style="font-size:12px;color:var(--ink-soft);margin:0 0 6px;" id="weatherLocationStatus"></p>
      <button type="button" class="btn-secondary" id="weatherLocationBtn" style="margin-top:0;">Use my location</button>
    </div>

    <div class="section-label" style="margin-top:20px;">Steps</div>
    <div class="step-list" id="routineStepList"></div>
    <button class="btn-secondary" id="addStepBtn">+ Add a step</button>

    <button class="btn-primary" id="saveRoutineBtn">Save routine</button>
    <button class="btn-secondary btn-danger hidden" id="deleteRoutineBtn">Delete routine</button>
  </div>
</div>

<!-- Step picker modal -->
<div class="modal-backdrop hidden" id="stepPickerModal">
  <div class="modal">
    <div class="modal-close-row"><button class="icon-btn" data-close="stepPickerModal">✕</button></div>
    <h2>Add a step</h2>
    <div class="section-label" style="margin-top:0;">Choose an existing action</div>
    <div class="picker-list" id="stepPickerList"></div>
    <div id="stepPickerEmpty" class="empty-state hidden" style="padding:20px;">
      <p>No custom actions yet — create one below.</p>
    </div>
    <button class="btn-secondary" id="createNewActionBtn">+ Create a new action</button>
  </div>
</div>

<!-- Action editor modal -->
<div class="modal-backdrop hidden" id="actionModal">
  <div class="modal">
    <div class="modal-close-row"><button class="icon-btn" data-close="actionModal">✕</button></div>
    <h2 id="actionModalTitle">New action</h2>
    <div class="field">
      <label>Name</label>
      <div class="name-icon-row">
        <input type="text" id="actionName" placeholder="e.g. Wash face with oil cleanser">
        <div class="icon-select">
          <input type="text" class="icon-select-btn" id="actionIconBtn" maxlength="8" autocomplete="off" spellcheck="false" title="Click for quick picks, or press Win + . to choose from all emoji">
          <div class="emoji-picker icon-select-panel hidden" id="actionEmojiPicker"></div>
        </div>
      </div>
    </div>
    <div class="field">
      <label>Type</label>
      <div class="type-toggle">

<script src="firebase-config.js"></script>
<script>
(function () {
  "use strict";

  var STORE_KEY = "routineapp.v1";
  var EMOJI_CHOICES = [
    // routine/self-care basics (kept first so common picks stay quick to reach)
    "🧴","🚿","🧼","💧","🪥","🧖","🧘","🏃","🍋","☕","📖","💊","🧹","🛏️","🌿","🧦","🧠","🎯","⏰","✨","😴","🥤","🪞","🧊",
    // smileys & people
    "😀","😃","😄","😁","😊","🙂","😉","😍","🥰","😘","😎","🤓","🧐","🤔","😴","🥱","😮‍💨","😤","😢","😭","😡","🥳","🤗","🙌","👏","👍","👎","🤝","🙏","💪","👀","🧑","👩","👨","👶","🧓","🧑‍💻","🧑‍🍳","🧑‍🎨","🧑‍⚕️","🧑‍🏫",
    // animals & nature
    "🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🐯","🦁","🐮","🐷","🐸","🐵","🐔","🐧","🐦","🦉","🦇","🐺","🐗","🐴","🦄","🐝","🐛","🦋","🐌","🐞","🐢","🐍","🦎","🐙","🐠","🐳","🐬","🦈","🌳","🌲","🌵","🌴","🌱","🌿","🍀","🌸","🌺","🌻","🌼","🌷","🍁","🍂","🍃","🌊","🔥","⭐","🌙","☀️","☁️","🌧️","⛈️","❄️","🌈",
    // food & drink
    "🍏","🍎","🍊","🍋","🍌","🍉","🍇","🍓","🫐","🍒","🍑","🥭","🍍","🥥","🥝","🍅","🥑","🥦","🥕","🌽","🥔","🍞","🥐","🥯","🧀","🥚","🍳","🥞","🧇","🥓","🍔","🍟","🍕","🌭","🥪","🌮","🌯","🍜","🍲","🍣","🍱","🍿","🍩","🍪","🎂","🍰","🧁","🍫","🍬","🍭","🍯","🥛","🍵","☕","🧃","🥤","🍷","🍺","🥃",
    // activities & travel
    "⚽","🏀","🏈","⚾","🎾","🏐","🏉","🎱","🏓","🏸","🥊","🥋","⛳","🏹","🎣","🤿","🏋️","🚴","🏊","🧗","🏇","⛸️","🎿","🛹","🛼","🎮","🎲","🧩","🎨","🎭","🎬","🎤","🎧","🎼","🎹","🥁","🎸","🎯","🎳","🧵","🧶","🚗","🚕","🚌","🚲","🛵","✈️","🚀","⛵","🚢","🏕️","🏖️","🗺️","🧭",
    // objects & symbols
    "💡","🔦","🕯️","🧯","🛠️","🔧","🔨","🪛","🧰","🔑","🔒","🔓","📱","💻","⌨️","🖥️","🖨️","📷","🎥","📺","📻","⏱️","⏲️","🕰️","📅","📆","🗓️","📌","📎","✂️","🖊️","🖋️","✏️","📝","📚","📖","📔","📒","📁","🗂️","📊","📈","📉","🧾","💰","💳","🎁","🛒","🧳","👜","🕶️","👓","👑","💍","🎓","🎗️","🏆","🥇","🏅",
    // symbols & misc
    "❤️","🧡","💛","💚","💙","💜","🖤","🤍","🤎","💔","❤️‍🔥","💯","✅","❌","❓","❗","⚠️","♻️","🔔","🔕","🚫","🆗","🆕","🔝","➕","➖","♾️"
  ];

  var state = load();
  var currentView = "home";
  var editingRoutineDraft = null;
  var editingActionId = null;
  var actionModalContext = null;
  var runState = null;
  var runTicker = null;
  var audioCtx = null;

  var TRIGGER_DEFAULTS = {
    type: "off",
    time: "07:00",
    days: [1, 2, 3, 4, 5],
    dayOfMonth: 1,
    intervalValue: 1,
    intervalUnit: "days",
    sunEvent: "sunrise",
    sunOffset: 0,
    weatherCmp: "above",
    weatherTemp: 20,
    weatherUnit: "C",
    lat: null,
    lon: null
  };

  function migrateRoutine(r) {
    if (!r.trigger) {
      var sch = r.schedule;
      r.trigger = Object.assign({}, TRIGGER_DEFAULTS, {
        type: (sch && sch.enabled) ? "weekly" : "off",
        time: (sch && sch.time) || "07:00",
        days: (sch && sch.days) ? sch.days.slice() : TRIGGER_DEFAULTS.days.slice()
      });
      delete r.schedule;
    }
    if (r.lastCompletedAt === undefined) r.lastCompletedAt = null;
    if (r.createdAt === undefined) r.createdAt = Date.now();
    return r;
  }

  function load() {
    var raw;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { raw = null; }
    var data = raw ? JSON.parse(raw) : {};
    return {
      actions: data.actions || [],
      routines: (data.routines || []).map(migrateRoutine),
      settings: Object.assign({ sound: true }, data.settings || {})
    };
  }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
    bumpLocalUpdatedAt();
    scheduleCloudPush();
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  // ---------- Cloud sync ----------
  var META_KEY = STORE_KEY + ".meta";
  var syncEnabled = !!(window.FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf("YOUR_") !== 0);
  var auth = null, db = null, unsubscribeDoc = null, cloudPushTimer = null, lastPushedAt = 0, applyingRemote = false;

  function showSyncError(err) {
    var el = document.getElementById("syncError");
    if (!el) return;
    if (!err) { el.classList.add("hidden"); el.textContent = ""; return; }
    el.textContent = "Sync error: " + (err.code || err.message || err);
    el.classList.remove("hidden");
  }

  function getLocalMeta() {
    try { return JSON.parse(localStorage.getItem(META_KEY)) || { updatedAt: 0 }; } catch (e) { return { updatedAt: 0 }; }
  }
  function setLocalMeta(meta) {
    try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) {}
  }
  function bumpLocalUpdatedAt() {
    if (applyingRemote) return;
    setLocalMeta({ updatedAt: Date.now() });
  }

  function scheduleCloudPush() {
    if (!syncEnabled || applyingRemote || !auth || !auth.currentUser) return;
    if (cloudPushTimer) clearTimeout(cloudPushTimer);
    cloudPushTimer = setTimeout(pushToCloud, 800);
  }

  function pushToCloud() {
    if (!auth || !auth.currentUser) return;
    var ts = Date.now();
    lastPushedAt = ts;
    setLocalMeta({ updatedAt: ts });
    db.collection("users").doc(auth.currentUser.uid).set({
      actions: state.actions, routines: state.routines, settings: state.settings, updatedAt: ts
    }).then(function () { showSyncError(null); }).catch(showSyncError);
  }

  function applyRemote(cloud) {
    applyingRemote = true;
    state = {
      actions: cloud.actions || [],
      routines: (cloud.routines || []).map(migrateRoutine),
      settings: Object.assign({ sound: true }, cloud.settings || {})
    };
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
    setLocalMeta({ updatedAt: cloud.updatedAt || Date.now() });
    applyingRemote = false;
    renderCurrentView();
  }

  function startListeningToCloud(userUid) {
    if (unsubscribeDoc) unsubscribeDoc();
    unsubscribeDoc = db.collection("users").doc(userUid).onSnapshot(function (snap) {
      if (!snap.exists) return;
      var cloud = snap.data();
      var cloudUpdatedAt = cloud.updatedAt || 0;
      if (cloudUpdatedAt === lastPushedAt) return;
      if (cloudUpdatedAt === getLocalMeta().updatedAt) return;
      applyRemote(cloud);
    }, showSyncError);
  }

  function reconcileOnSignIn(userUid) {
    var ref = db.collection("users").doc(userUid);
    ref.get().then(function (snap) {
      var localMeta = getLocalMeta();
      var localHasData = state.actions.length || state.routines.length;
      if (snap.exists) {
        var cloud = snap.data();
        var cloudUpdatedAt = cloud.updatedAt || 0;
        var cloudHasData = (cloud.actions && cloud.actions.length) || (cloud.routines && cloud.routines.length);
        if (cloudUpdatedAt === localMeta.updatedAt) {
          // already in sync
        } else if (!localHasData) {
          applyRemote(cloud);
        } else if (localMeta.updatedAt > cloudUpdatedAt) {
          if (cloudHasData) {
            var useCloud = confirm(
              "Your account already has synced routines (last updated " + new Date(cloudUpdatedAt).toLocaleString() + ").\n" +
              "This device also has local data (last updated " + new Date(localMeta.updatedAt).toLocaleString() + ").\n\n" +
              "Press OK to use the ACCOUNT data (replacing what's on this device), or Cancel to keep THIS DEVICE's data (replacing your account data)."
            );
            if (useCloud) applyRemote(cloud); else pushToCloud();
          } else {
            pushToCloud();
          }
        } else {
          applyRemote(cloud);
        }
      } else {
        pushToCloud();
      }
      startListeningToCloud(userUid);
    }).catch(showSyncError);
  }

  function updateSyncUI(user) {
    var field = document.getElementById("syncField");
    if (!field) return;
    field.classList.remove("hidden");
    var signedOut = document.getElementById("syncSignedOut");
    var signedIn = document.getElementById("syncSignedIn");
    if (user) {
      signedOut.classList.add("hidden");
      signedIn.classList.remove("hidden");
      document.getElementById("syncAccountRow").textContent = "Signed in as " + (user.email || user.displayName || "your account");
    } else {
      signedOut.classList.remove("hidden");
      signedIn.classList.add("hidden");
    }
  }

  function initSync() {
    if (!syncEnabled || typeof firebase === "undefined") return;
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      auth = firebase.auth();
      db = firebase.firestore();
    } catch (e) { syncEnabled = false; return; }

    document.getElementById("syncField").classList.remove("hidden");

    document.getElementById("signOutBtn").addEventListener("click", function () {
      if (unsubscribeDoc) { unsubscribeDoc(); unsubscribeDoc = null; }
      if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
      auth.signOut();
    });

    // Uses Google Identity Services (FedCM) for sign-in instead of Firebase's
    // signInWithRedirect/signInWithPopup — those rely on a cross-domain hop
    // through the Firebase authDomain that Chrome's third-party storage
    // blocking can silently break, with no error to catch.
    if (window.google && google.accounts && google.accounts.id && typeof GOOGLE_CLIENT_ID === "string" && GOOGLE_CLIENT_ID.indexOf("YOUR_") !== 0) {
      try {
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: function (response) {
            showSyncError(null);
            var credential = firebase.auth.GoogleAuthProvider.credential(response.credential);
            auth.signInWithCredential(credential).catch(showSyncError);
          }
        });
        google.accounts.id.renderButton(document.getElementById("googleSignInBtn"), {
          type: "standard", theme: "outline", size: "large", text: "signin_with", shape: "pill", width: 280
        });
      } catch (e) {
        showSyncError({ message: "Google Sign-In failed to load. Check your connection and try again." });
      }
    } else {
      showSyncError({ message: "Google Sign-In library didn't load. Check your connection and try again." });
    }

    var reconciled = false;
    auth.onAuthStateChanged(function (user) {
      updateSyncUI(user);
      if (user && !reconciled) {
        reconciled = true;
        reconcileOnSignIn(user.uid);
      } else if (!user) {
        reconciled = false;
        if (unsubscribeDoc) { unsubscribeDoc(); unsubscribeDoc = null; }
      }
    });
  }

  function fmtDuration(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" + s : s);
  }

  var DAY_LABELS = ["S", "M", "T", "W", "T", "F", "S"];
  var DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  function fmtTime12(time) {
    var parts = (time || "00:00").split(":");
    var h = parseInt(parts[0], 10) || 0;
    var m = parts[1] || "00";
    var ampm = h >= 12 ? "PM" : "AM";
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ":" + m + " " + ampm;
  }

  function fmtScheduleDays(days) {
    if (days.length === 7) return "Every day";
    return days.slice().sort().map(function (d) { return DAY_NAMES[d]; }).join(" ");
  }

  function timeToMinutes(time) {
    var parts = (time || "00:00").split(":");
    return (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
  }

  // ---------- Sunrise / sunset (NOAA-style approximation, no network needed) ----------
  function toRad(d) { return d * Math.PI / 180; }
  function toDeg(r) { return r * 180 / Math.PI; }
  function fixRange(v, range) { while (v < 0) v += range; while (v >= range) v -= range; return v; }

  function getSunTimeForDate(lat, lon, date, isSunset) {
    var zenith = 90.833;
    var year = date.getFullYear(), month = date.getMonth() + 1, day = date.getDate();
    var N1 = Math.floor(275 * month / 9);
    var N2 = Math.floor((month + 9) / 12);
    var N3 = (1 + Math.floor((year - 4 * Math.floor(year / 4) + 2) / 3));
    var N = N1 - (N2 * N3) + day - 30;

    var lngHour = lon / 15;
    var t = isSunset ? N + ((18 - lngHour) / 24) : N + ((6 - lngHour) / 24);

    var M = (0.9856 * t) - 3.289;
    var L = M + (1.916 * Math.sin(toRad(M))) + (0.020 * Math.sin(2 * toRad(M))) + 282.634;
    L = fixRange(L, 360);

    var RA = toDeg(Math.atan(0.91764 * Math.tan(toRad(L))));
    RA = fixRange(RA, 360);
    var Lquadrant = Math.floor(L / 90) * 90;
    var RAquadrant = Math.floor(RA / 90) * 90;
    RA = (RA + (Lquadrant - RAquadrant)) / 15;

    var sinDec = 0.39782 * Math.sin(toRad(L));
    var cosDec = Math.cos(Math.asin(sinDec));
    var cosH = (Math.cos(toRad(zenith)) - (sinDec * Math.sin(toRad(lat)))) / (cosDec * Math.cos(toRad(lat)));
    if (cosH > 1 || cosH < -1) return null; // sun never rises/sets that day at this latitude

    var H = isSunset ? toDeg(Math.acos(cosH)) : 360 - toDeg(Math.acos(cosH));
    H = H / 15;

    var T = H + RA - (0.06571 * t) - 6.622;
    var UT = fixRange(T - lngHour, 24);

    var hours = Math.floor(UT);
    var minutes = Math.floor((UT - hours) * 60);
    return new Date(Date.UTC(year, month - 1, day, hours, minutes));
  }

  // ---------- Weather (Open-Meteo, keyless) ----------
  var weatherCache = {};
  var WEATHER_STALE_MS = 15 * 60 * 1000;

  function weatherCacheKey(lat, lon) { return lat.toFixed(2) + "," + lon.toFixed(2); }
  function getWeatherCacheEntry(lat, lon) { return weatherCache[weatherCacheKey(lat, lon)] || null; }

  function fetchWeatherIfStale(lat, lon) {
    var key = weatherCacheKey(lat, lon);
    var entry = weatherCache[key];
    if (entry && entry.fetching) return;
    if (entry && (Date.now() - entry.fetchedAt) < WEATHER_STALE_MS) return;
    weatherCache[key] = Object.assign({}, entry, { fetching: true });
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + "&current=temperature_2m";
    fetch(url).then(function (res) { return res.json(); }).then(function (data) {
      var temp = data && data.current && typeof data.current.temperature_2m === "number" ? data.current.temperature_2m : null;
      weatherCache[key] = { tempC: temp, fetchedAt: Date.now(), fetching: false };
      if (currentView === "home") renderHome();
    }).catch(function () {
      weatherCache[key] = { tempC: entry ? entry.tempC : null, fetchedAt: Date.now(), fetching: false };
    });
  }

  function ensureWeatherData() {
    state.routines.forEach(function (r) {
      var t = r.trigger;
      if (t && t.type === "weather" && t.lat != null && t.lon != null) fetchWeatherIfStale(t.lat, t.lon);
    });
  }

  // ---------- Trigger "due" checks ----------
  function isWeeklyDue(t, now) {
    if (!t.days || !t.days.length) return false;
    if (t.days.indexOf(now.getDay()) === -1) return false;
    return (now.getHours() * 60 + now.getMinutes()) >= timeToMinutes(t.time);
  }

  function isMonthlyDue(t, now) {
    if (now.getDate() !== (t.dayOfMonth || 1)) return false;
    return (now.getHours() * 60 + now.getMinutes()) >= timeToMinutes(t.time);
  }

  function isIntervalDue(r, t, now) {
    var baseline = r.lastCompletedAt || r.createdAt || 0;
    var unitMs = t.intervalUnit === "hours" ? 3600000 : 86400000;
    var intervalMs = Math.max(1, t.intervalValue || 1) * unitMs;
    return (now.getTime() - baseline) >= intervalMs;
  }

  function isSunDue(t, now) {
    if (t.lat == null || t.lon == null) return false;
    var sunTime = getSunTimeForDate(t.lat, t.lon, now, t.sunEvent === "sunset");
    if (!sunTime) return false;
    sunTime = new Date(sunTime.getTime() + (t.sunOffset || 0) * 60000);
    return now.getTime() >= sunTime.getTime() && now.toDateString() === sunTime.toDateString();
  }

  function isWeatherDue(t) {
    if (t.lat == null || t.lon == null) return false;
    var entry = getWeatherCacheEntry(t.lat, t.lon);
    if (!entry || entry.tempC == null) return false;
    var temp = t.weatherUnit === "F" ? (entry.tempC * 9 / 5 + 32) : entry.tempC;
    return t.weatherCmp === "above" ? temp >= t.weatherTemp : temp <= t.weatherTemp;
  }

  function isRoutineDue(r) {
    var t = r.trigger;
    if (!t || t.type === "off") return false;
    var now = new Date();
    if (t.type === "weekly") return isWeeklyDue(t, now);
    if (t.type === "monthly") return isMonthlyDue(t, now);
    if (t.type === "interval") return isIntervalDue(r, t, now);
    if (t.type === "sun") return isSunDue(t, now);
    if (t.type === "weather") return isWeatherDue(t);
    return false;
  }

  function fmtTriggerSummary(t) {
    if (t.type === "weekly") return "⏰ " + fmtTime12(t.time) + " " + fmtScheduleDays(t.days);
    if (t.type === "monthly") return "⏰ Day " + t.dayOfMonth + " · " + fmtTime12(t.time);
    if (t.type === "interval") return "🔁 Every " + t.intervalValue + " " + t.intervalUnit;
    if (t.type === "sun") {
      var label = (t.sunEvent === "sunset" ? "🌇 Sunset" : "🌅 Sunrise");
      return label + (t.sunOffset ? " " + (t.sunOffset > 0 ? "+" : "") + t.sunOffset + "m" : "");
    }
    if (t.type === "weather") return "🌡️ " + (t.weatherCmp === "above" ? "Above " : "Below ") + t.weatherTemp + "°" + t.weatherUnit;
    return "";
  }

  function findAction(id) {
    for (var i = 0; i < state.actions.length; i++) if (state.actions[i].id === id) return state.actions[i];
    return null;
  }

  function findRoutine(id) {
    for (var i = 0; i < state.routines.length; i++) if (state.routines[i].id === id) return state.routines[i];
    return null;
  }

  // ---------- Navigation ----------
  function setView(v) {
    currentView = v;
    document.getElementById("view-home").classList.toggle("hidden", v !== "home");
    document.getElementById("view-actions").classList.toggle("hidden", v !== "actions");

  function updateLocationStatus() {
    var t = editingRoutineDraft.trigger;

  function requestTriggerLocation() {
    if (!navigator.geolocation) {
      document.getElementById("sunLocationStatus").textContent = "Geolocation isn't supported on this device.";
      document.getElementById("weatherLocationStatus").textContent = "Geolocation isn't supported on this device.";
      return;
    }
    document.getElementById("sunLocationStatus").textContent = "Locating…";
    document.getElementById("weatherLocationStatus").textContent = "Locating…";
    navigator.geolocation.getCurrentPosition(function (pos) {
      editingRoutineDraft.trigger.lat = pos.coords.latitude;
      editingRoutineDraft.trigger.lon = pos.coords.longitude;
      updateLocationStatus();
    }, function () {
      var errText = "Couldn't get your location — allow location access and try again.";
      document.getElementById("sunLocationStatus").textContent = errText;
      document.getElementById("weatherLocationStatus").textContent = errText;
    }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });

  // ---------- Run mode ----------
  function beep() {
    if (!state.settings.sound) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.2, audioCtx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.4);
    } catch (e) {}
  }

  function startRun(routineId) {
    var r = findRoutine(routineId);
    if (!r || !r.steps.length) return;
    runState = { routineId: routineId, index: 0, running: false, remaining: 0, endsAt: null, finished: false };
    prepStep();
    document.getElementById("runOverlay").classList.remove("hidden");
    renderRun();
  }

  function currentRoutine() { return findRoutine(runState.routineId); }
  function currentStep() {
    var r = currentRoutine();
    var s = r.steps[runState.index];
    return { step: s, action: findAction(s.actionId) };
  }

  function prepStep() {
    var cs = currentStep();
    if (cs.action && cs.action.kind === "timer") {
      runState.remaining = cs.action.duration;
      runState.running = false;
      runState.endsAt = null;
    }
  }

  function renderRun() {
    var r = currentRoutine();
    document.getElementById("runTitle").textContent = r.icon + " " + r.name;

    var dotsEl = document.getElementById("runDots");
    dotsEl.innerHTML = "";
    r.steps.forEach(function (s, i) {
      var span = document.createElement("span");
      if (i < runState.index) span.className = "done";
      else if (i === runState.index) span.className = "current";
      dotsEl.appendChild(span);
    });

    var bodyEl = document.getElementById("runBody");
    var bottomEl = document.getElementById("runBottom");

    if (runState.finished) {
      bodyEl.innerHTML =
        '<div class="run-complete"><div class="big">🎉</div>' +
        '<h2 class="run-name">Routine complete</h2>' +
        '<p style="opacity:0.85;">' + escapeHtml(r.name) + ' — nice work.</p></div>';
      bottomEl.innerHTML = '<button class="btn-next" id="runDoneBtn" style="border-radius:14px;">Done</button>';
      document.getElementById("runDoneBtn").addEventListener("click", closeRun);
      return;
    }

    var cs = currentStep();
    var a = cs.action;
    if (!a) { advanceStep(); return; }

    var html = '<div class="run-emoji">' + a.icon + '</div><div class="run-name">' + escapeHtml(a.name) + '</div>';

    if (a.kind === "timer") {
      var total = a.duration;
      var remaining = runState.remaining;
      var pct = total > 0 ? (total - remaining) / total : 0;
      var radius = 88, circ = 2 * Math.PI * radius;
      var offset = circ * (1 - pct);
      html +=
        '<div class="run-timer-ring">' +
          '<svg width="200" height="200" viewBox="0 0 200 200">' +
            '<circle class="ring-bg" cx="100" cy="100" r="' + radius + '"></circle>' +
            '<circle class="ring-fg" cx="100" cy="100" r="' + radius + '" stroke-dasharray="' + circ + '" stroke-dashoffset="' + offset + '"></circle>' +
          '</svg>' +
          '<div class="ring-label">' + fmtDuration(remaining) + '</div>' +
        '</div>' +
        '<div class="run-timer-controls">' +
          '<button id="runTimerToggle" class="primary">' + (runState.running ? "Pause" : (remaining < total ? "Resume" : "Start")) + '</button>' +
          '<button id="runTimerReset">Reset</button>' +
        '</div>';
    }

    bodyEl.innerHTML = html;

    if (a.kind === "timer") {
      document.getElementById("runTimerToggle").addEventListener("click", toggleTimer);
      document.getElementById("runTimerReset").addEventListener("click", function () {
        pauseTicker();
        runState.remaining = a.duration;
        renderRun();
      });
    }

    var backDisabled = runState.index === 0;
    bottomEl.innerHTML =
      '<button class="btn-back" id="runBackBtn"' + (backDisabled ? ' style="opacity:0.35;" disabled' : '') + '>←</button>' +
      '<button class="btn-next" id="runNextBtn">' + (a.kind === "timer" ? "Skip" : "Done — next") + '</button>';
    document.getElementById("runNextBtn").addEventListener("click", advanceStep);
    if (!backDisabled) document.getElementById("runBackBtn").addEventListener("click", goBackStep);
  }

  function toggleTimer() {
    var cs = currentStep();
    if (runState.running) {
      pauseTicker();
    } else {
      runState.running = true;
      runState.endsAt = Date.now() + runState.remaining * 1000;
      runTicker = setInterval(tickTimer, 250);
    }
    renderRun();
  }

  function tickTimer() {
    if (!runState || !runState.running) return;
    var msLeft = runState.endsAt - Date.now();
    var secLeft = Math.max(0, Math.round(msLeft / 1000));
    if (secLeft !== runState.remaining) {
      runState.remaining = secLeft;
      if (secLeft <= 0) {
        pauseTicker();
        beep();
        if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
        advanceStep();
        return;
      }
      updateTimerUI();
    }
  }

  function updateTimerUI() {
    var ring = document.querySelector(".ring-fg");
    var label = document.querySelector(".ring-label");
    var cs = currentStep();
    if (!ring || !cs.action) return;
    var total = cs.action.duration;
    var pct = total > 0 ? (total - runState.remaining) / total : 0;
    var radius = 88, circ = 2 * Math.PI * radius;
    ring.setAttribute("stroke-dashoffset", circ * (1 - pct));
    label.textContent = fmtDuration(runState.remaining);
  }

  function pauseTicker() {
    if (runTicker) { clearInterval(runTicker); runTicker = null; }
    if (runState) runState.running = false;
  }

  function advanceStep() {
    pauseTicker();
    var r = currentRoutine();
    if (runState.index < r.steps.length - 1) {
      runState.index++;
      prepStep();
      renderRun();
    } else {
      runState.finished = true;
      renderRun();
    }
  }

  function goBackStep() {
    pauseTicker();
    if (runState.index > 0) {
      runState.index--;
      prepStep();
      renderRun();
    }
  }

  function closeRun() {
    pauseTicker();
    if (runState && runState.finished) {
      var r = findRoutine(runState.routineId);
      if (r) { r.lastCompletedAt = Date.now(); save(); }
    }
    runState = null;
    document.getElementById("runOverlay").classList.add("hidden");
    renderHome();
  }

  document.getElementById("runCloseBtn").addEventListener("click", function () {
    if (runState && !runState.finished) {
      if (!confirm("Stop this routine? Your progress won't be saved.")) return;
    }
    closeRun();
  });

  // ---------- Init ----------
  initSync();
  setView("home");

  setInterval(function () { if (currentView === "home") renderHome(); }, 60000);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
